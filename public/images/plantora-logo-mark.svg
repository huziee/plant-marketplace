<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18482e" />
      <stop offset="100%" stop-color="#0c2519" />
    </linearGradient>
    <linearGradient id="leafGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bada3a" />
      <stop offset="100%" stop-color="#e2f578" />
    </linearGradient>
    <linearGradient id="leafGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ef69" />
      <stop offset="100%" stop-color="#8bb71c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="140" fill="none" stroke="#d7ef69" stroke-width="6" stroke-opacity="0.2" />

  <!-- Botanical Seedling Logo Icon -->
  <g filter="url(#glow)">
    <!-- Main Stem -->
    <path d="M 256 390 C 256 310 256 250 256 160" stroke="#d7ef69" stroke-width="28" stroke-linecap="round" fill="none"/>
    
    <!-- Left Leaf -->
    <path d="M 256 280 C 200 270 120 230 110 160 C 170 150 230 200 256 260 Z" fill="url(#leafGradLeft)" />
    
    <!-- Right Leaf -->
    <path d="M 256 220 C 310 200 390 150 402 80 C 340 70 275 130 256 200 Z" fill="url(#leafGradRight)" />

    <!-- Small Accent Sprout Drop -->
    <circle cx="256" cy="390" r="14" fill="#d7ef69" />
  </g>
</svg>
